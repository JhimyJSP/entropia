  <!-- Schema.org estructurado (WebApplication + FAQPage) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "WebApplication",
        "@id": "https://jhimyjsp.github.io/entropia/#webapp",
        "name": "Entropía — Cuaderno 3D de Econofísica",
        "url": "https://jhimyjsp.github.io/entropia/",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "All",
        "description": "Plataforma educativa inmersiva estructurada como un cuaderno científico 3D para estudiar econofísica y dinámicas complejas.",
        "genre": "Econofísica",
        "author": {
          "@type": "Person",
          "name": "Jhimy Sayas Parodi"
        }
      },
      {
        "@type": "FAQPage",
        "@id": "https://jhimyjsp.github.io/entropia/#faq",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "¿Qué es la econofísica y qué estudia?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "La econofísica es una disciplina interdisciplinaria que aplica herramientas de la física estadística, la teoría del caos y los sistemas complejos para modelar mercados financieros y distribuciones socioeconómicas."
            }
          },
          {
            "@type": "Question",
            "name": "¿Por qué la econofísica rechaza la campana de Gauss en finanzas?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Porque las fluctuaciones de precios presentan colas pesadas (fat tails) y leyes de potencias, haciendo que los colapsos y pánicos ocurran con mucha mayor frecuencia de lo predicho por una distribución normal."
            }
          }
        ]
      }
    ]
  }

</head>
<body>

  <!-- 1. CONTROLES AMBIENTALES SUPERIORES (DISCRETOS) -->
  <header class="ambient-controls" role="toolbar" aria-label="Controles ambientales">
    <button class="ambient-btn" id="btn-audio-mute" title="Silenciar / Activar sonido" aria-label="Control de sonido">
      <span id="audio-icon">🔊</span>
      <span id="audio-text" class="mono">Audio</span>
    </button>
    <button class="ambient-btn" id="btn-accessible-toggle" title="Modo lectura 2D accesible (sin WebGL)" aria-label="Modo lectura plana">
      <span>📖</span>
      <span class="mono">Modo 2D</span>
    </button>
    <button class="ambient-btn" id="btn-index" title="Volver al índice" aria-label="Volver al índice">
      <span>☰</span>
      <span class="mono">Índice</span>
    </button>
  </header>

  <!-- 2. ESCENARIO THREE.JS (CANVAS 3D DEL CUADERNO CERRADO) -->
  <main id="canvas-container" aria-label="Escenario 3D interactivo">
    <canvas id="book-canvas"></canvas>
  </main>

  <!-- 3. INVITACIÓN VISUAL INICIAL (SOLO VISIBLE CON CUADERNO CERRADO) -->
  <section class="book-invitation-overlay" id="book-invite" aria-live="polite">
    <div class="invite-badge">
      <span class="invite-pulse"></span>
      <span>CUADERNO CIENTÍFICO 3D</span>
    </div>
    <br>
    <button class="btn-open-book" id="btn-open-book" aria-label="Abrir el cuaderno científico">
      <span>Abrir Cuaderno de Investigación</span>
      <span>↗</span>
    </button>
    <div class="invite-subtext">Pulsa la portada o presiona [Espacio / Enter]</div>
  </section>

  <!-- 4. CONTENEDOR DEL CUADERNO ABIERTO (LECTURA DOBLE PÁGINA) -->
  <section class="open-book-viewport" id="book-viewport" aria-label="Lectura del cuaderno">
    <div class="book-spread-wrapper" id="pages-container">
      <!-- Página Izquierda -->
      <article class="page-sheet left-page" id="left-page" tabindex="0" aria-label="Página izquierda">
        <!-- Contenido inyectado dinámicamente -->
      </article>

      <!-- Página Derecha -->
      <article class="page-sheet right-page" id="right-page" tabindex="0" aria-label="Página derecha">
        <!-- Contenido inyectado dinámicamente -->
      </article>
    </div>
  </section>

  <!-- 5. DOCK INFERIOR DE NAVEGACIÓN Y PROGRESO -->
  <nav class="book-bottom-dock" id="bottom-dock" aria-label="Navegación del libro">
    <button class="dock-btn" id="dock-btn-prev" aria-label="Página anterior">
      <span>←</span>
      <span>Anterior</span>
    </button>

    <button class="dock-btn" id="dock-btn-toc" aria-label="Ir al índice o temario">
      <span>📖</span>
      <span>Índice</span>
    </button>

    <div class="reading-progress-track" aria-hidden="true" title="Progreso de lectura">
      <div class="reading-progress-fill" id="reading-progress-fill"></div>
    </div>

    <div class="page-indicator-text mono" id="page-indicator">Pág. 1 de 26</div>

    <button class="dock-btn" id="dock-btn-next" aria-label="Página siguiente">
      <span>Siguiente</span>
      <span>→</span>
    </button>

    <button class="dock-btn" id="dock-btn-close" aria-label="Cerrar el cuaderno" title="Cerrar cuaderno">
      <span>↺</span>
      <span>Cerrar</span>
    </button>
  </nav>

  <!-- LIBRERÍAS EXTERNAS: THREE.JS Y KATEX -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

  <!-- MÓDULOS DEL PROYECTO -->
  <script src="book-content.js?v=20261029-3"></script>
  <script src="audio.js"></script>
  <script src="book-3d.js?v=chapter2"></script>
  <script src="chapter-1-data.js?v=2"></script>
  <script src="chapter-1-renderer.js?v=8"></script>
  <script src="learning-engine.js?v=chapter5"></script>

  <!-- LÓGICA DE CONTROL GLOBAL Y ACCESIBILIDAD -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Controles de audio
      const muteBtn = document.getElementById('btn-audio-mute');
      const audioIcon = document.getElementById('audio-icon');

      if (muteBtn && window.bookAudio) {
        if (window.bookAudio.isMuted) {
          audioIcon.textContent = '🔇';
          muteBtn.classList.add('muted');
        }
        muteBtn.onclick = () => {
          const muted = window.bookAudio.toggleMute();
          audioIcon.textContent = muted ? '🔇' : '🔊';
          muteBtn.classList.toggle('muted', muted);
        };
      }

      // Modo Accesible 2D (sin WebGL)
      const accBtn = document.getElementById('btn-accessible-toggle');
      if (accBtn) {
        const isAcc = localStorage.getItem('entropia-accessible-mode') === 'true';
        if (isAcc) {
          document.body.classList.add('accessible-mode');
          accBtn.classList.add('active');
        }

        accBtn.onclick = () => {
          const nowAcc = document.body.classList.toggle('accessible-mode');
          accBtn.classList.toggle('active', nowAcc);
          accBtn.querySelector('.mono').textContent = nowAcc ? 'Volver a 3D' : 'Modo 2D';
          localStorage.setItem('entropia-accessible-mode', String(nowAcc));
          if (window.learningEngine) {
            window.learningEngine.renderCurrentSpread();
          }
        };
      }
      if (accBtn && document.body.classList.contains('accessible-mode')) {
        accBtn.querySelector('.mono').textContent = 'Volver a 3D';
      }

      const indexBtn = document.getElementById('btn-index');
      if (indexBtn && window.learningEngine) {
        indexBtn.onclick = () => window.learningEngine.goToPage(1);
      }

      // Botones del dock inferior
      const prevBtn = document.getElementById('dock-btn-prev');
      const nextBtn = document.getElementById('dock-btn-next');
      const tocBtn = document.getElementById('dock-btn-toc');
      const closeDockBtn = document.getElementById('dock-btn-close');

      if (prevBtn && window.learningEngine) {
        prevBtn.onclick = () => window.learningEngine.prevPage();
      }
      if (nextBtn && window.learningEngine) {
        nextBtn.onclick = () => window.learningEngine.nextPage();
      }
      if (tocBtn && window.learningEngine) {
        tocBtn.onclick = () => window.learningEngine.goToPage(1);
      }
      if (closeDockBtn && window.book3D) {
        closeDockBtn.onclick = () => window.book3D.closeBook();
      }
    });
  </script>
</body>
</html>
